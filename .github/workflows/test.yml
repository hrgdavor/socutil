name: test

on:
  # Branches only. A tag is the release workflow's event; without this filter a tag push ran this test
  # suite *and* the release workflow, so one tag produced two workflow runs (plus a second test run when
  # the same commit was also pushed to main).
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # build.zig refuses any compiler but 0.17 on purpose.
      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.17.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Unit tests
        run: zig build test --summary all

      - name: End-to-end
        run: |
          zig build -Doptimize=ReleaseFast
          bun e2e.mjs
